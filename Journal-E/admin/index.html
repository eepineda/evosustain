<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evoford Journal CMS</title><style>body{margin:0;background:#f7f6f1;color:#111;font:14px Arial}.wrap{max-width:950px;margin:auto;padding:25px}.brand{font:45px Georgia;border-bottom:2px solid #111;padding-bottom:15px}.brand i{color:#176b55}.panel{background:white;border:1px solid #ccc;padding:20px;margin-top:20px}label{display:block;font-weight:bold;margin:12px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin-top:5px;border:1px solid #bbb}textarea{min-height:160px}button{background:#111;color:#fff;border:0;padding:12px 18px;margin-right:8px}@media(max-width:700px){.brand{font-size:34px}}</style></head><body><div class="wrap"><div class="brand">Evoford <i>Journal</i></div><div class="panel"><h2>Nueva noticia</h2><p>CMS sencillo. Genera un <code>posts.json</code> para colocar en <code>data/</code>.</p><label>Título<input id="title"></label><label>Resumen<textarea id="dek"></textarea></label><label>Texto<textarea id="body"></textarea></label><label>Sección<input id="section" value="República Dominicana"></label><label>Imagen URL<input id="image"></label><label>Fuente<input id="source" value="Evoford Journal"></label><label>URL fuente<input id="source_url" value="https://evoford.com/"></label><button onclick="download()">Descargar posts.json</button><a href="../dist/index.html"> Ver web →</a></div></div><script>function download(){let title=document.getElementById('title').value;if(!title)return alert('Escribe un título');let slug=title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');let p=[{id:Date.now().toString(),slug,title,dek:document.getElementById('dek').value,body:document.getElementById('body').value,section:document.getElementById('section').value,date:new Date().toLocaleDateString('es-ES'),author:'Evoford Journal',image:document.getElementById('image').value,source:document.getElementById('source').value,source_url:document.getElementById('source_url').value,type:'EDITORIAL',featured:false}];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));a.download='posts.json';a.click()}</script></body></html>
