<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Dursun Dispatch: miniature broadsheet front page -->
  <rect width="64" height="64" rx="6" fill="#FCFBF7"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="4" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <!-- masthead rule -->
  <rect x="11" y="13" width="42" height="4.5" fill="#1a1a1a"/>
  <!-- serif D monogram -->
  <text x="32" y="47.5" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="700" text-anchor="middle" fill="#1a1a1a">D</text>
  <!-- kicker-red lead rule -->
  <rect x="21" y="51.5" width="22" height="3.5" fill="#8b0000"/>
</svg>
