<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evoford Journal · CMS</title><link rel="stylesheet" href="admin.css"></head><body><header><a href="index.html">Evoford <i>Journal</i></a><span>EDITORIAL CMS</span></header><main><section class="hero"><div><small>LOCAL EDITORIAL DESK</small><h1>Publicar una historia.</h1><p>Crea, revisa y exporta contenido sin tocar código.</p></div><div class="actions"><button id="newBtn">Nueva historia</button><button id="exportBtn">Exportar posts.json</button><label class="import">Importar JSON<input id="importFile" type="file" accept="application/json"></label></div></section><section class="layout"><aside><h2>Borradores / historias</h2><div id="list"></div></aside><form id="editor"><input type="hidden" id="slug"><label>Título<input id="title" required></label><label>Resumen<textarea id="dek" required></textarea></label><div class="two"><label>Sección<select id="section"><option>República Dominicana</option><option>Economía</option><option>Technology</option><option>Comunidad</option><option>Perspectiva</option><option>Internacional</option></select></label><label>Fecha<input id="date" type="date" required></label></div><div class="two"><label>Autor<input id="author" value="Evoford Journal"></label><label>Tipo<select id="type"><option value="editorial">Editorial</option><option value="official">Oficial</option><option value="press">Prensa</option></select></label></div><label>Imagen — URL pública<input id="image" placeholder="https://..."></label><label>Fuente<input id="source" placeholder="FAO / Diario Libre / Evoford Journal"></label><label>URL de fuente<input id="source_url" placeholder="https://..."></label><label>Texto del artículo<textarea id="body" rows="10" placeholder="Texto completo..."></textarea></label><label class="check"><input id="featured" type="checkbox"> Destacar en portada</label><div class="form-actions"><button type="submit">Guardar historia</button><button type="button" id="deleteBtn" class="danger">Eliminar</button></div></form></section></main><script src="admin.js"></script></body></html>
