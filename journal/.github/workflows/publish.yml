name: Evoford Journal - Build and Publish
on:
  push:
    branches: ["main"]
    paths:
      - "content/**"
      - "assets/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "config.json"
      - "data/sources.json"
      - "scripts/**"
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: evoford-journal
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - name: Build all content
        run: python scripts/build_site.py
      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/search.json articles feed.xml sitemap.xml
          git diff --cached --quiet || git commit -m "Build Journal"
          git push
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4
