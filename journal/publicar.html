<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evoford Journal — Publish</title><style>body{font:15px Arial;margin:0;background:#fbfbf8;color:#111}.wrap{max-width:900px;margin:40px auto;padding:0 20px}h1{font:42px Georgia}.grid{display:grid;gap:15px}label{font-size:11px;font-weight:800;text-transform:uppercase}input,select,textarea{display:block;width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #d6dbd8;background:white}textarea{min-height:320px}button{background:#137653;color:#fff;border:0;padding:14px 20px;font-weight:800;cursor:pointer}.note{background:#e4f2eb;padding:14px;margin:20px 0}.preview{border:1px solid #d6dbd8;padding:10px;background:#fff}.preview img{width:100%;max-height:400px;object-fit:cover}.status{font-size:12px;color:#667;margin-top:8px}</style></head><body><main class="wrap"><h1>Evoford Journal</h1><p>Professional publishing desk</p><div class="note"><b>Automated:</b> create the story, paste any public direct image URL, generate the Markdown file and put it in <code>content/</code>. GitHub Actions builds, indexes and deploys the Journal.</div><div class="grid"><label>Headline<input id="title"></label><label>Category<select id="category"><option>News</option><option>Sustainability</option><option>Technology</option><option>Smart Cities</option><option>Waste & Operations</option><option>Perspective</option></select></label><label>Date<input id="date" type="date"></label><label>Source<input id="source" value="Evoford Journal"></label><label>Excerpt<input id="excerpt"></label><label>Image URL<input id="image" placeholder="https://example.com/photo.webp"></label><div class="preview"><img id="preview" src="assets/green.svg"><div class="status" id="status">Paste a direct public image URL.</div></div><label>Image alt text<input id="alt"></label><label>Story<textarea id="body"></textarea></label><button id="go">Generate Markdown article</button></div></main><script>const $=id=>document.getElementById(id);$("date").value=new Date().toISOString().slice(0,10);$("image").oninput=()=>{$("preview").src=$("image").value||"assets/green.svg"};$("preview").onload=()=>$("status").textContent="Image ready.";$("preview").onerror=()=>$("status").textContent="Could not load image. Use a direct public image URL.";$("go").onclick=()=>{let t=$("title").value.trim();if(!t)return alert("Add a headline");let slug=t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");let esc=v=>v.replace(/"/g,'\"');let md=`---
title: "${esc(t)}"
category: "${esc($("category").value)}"
date: "${$("date").value}"
excerpt: "${esc($("excerpt").value)}"
source: "${esc($("source").value)}"
image: "${esc($("image").value||"assets/green.svg")}"
image_alt: "${esc($("alt").value)}"
slug: "${slug}"
---

${$("body").value}
`;let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([md],{type:"text/markdown"}));a.download=slug+".md";a.click()};</script></body></html>
