<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evoford Journal — Publishing Desk</title><link rel="stylesheet" href="styles.css"></head><body><main class="container articlePage"><a class="back" href="./">← Evoford Journal</a><div class="eyebrow" style="margin-top:28px">Publishing desk</div><h1>New story</h1><p class="articleDeck">Create an editorial Markdown file. Images can come from any public direct URL.</p><div class="pubGrid">
<label>Headline<input id="title"></label><label>Category<select id="category"><option>News</option><option>Sustainability</option><option>Technology</option><option>Smart Cities</option><option>Waste & Operations</option><option>Perspective</option></select></label><label>Date<input id="date" type="date"></label><label>Author<input id="author" value="Evoford Journal"></label><label>Read time<input id="read_time" value="4 min read"></label><label>Source<input id="source" value="Evoford Journal"></label><label>Excerpt<textarea id="excerpt" class="short"></textarea></label><label>Public image URL<input id="image" placeholder="https://example.com/image.webp"></label><label>Image alt text<input id="alt"></label><label>Image caption<input id="caption"></label><label>Image credit<input id="credit"></label><div class="preview"><img id="preview" src="assets/green.svg" alt=""><div id="status" class="meta">Paste a public direct image URL.</div></div><label>Story body<textarea id="body" placeholder="Write paragraphs separated by a blank line. Use ## for section headings, > for pull quotes, **bold**, *italic*."></textarea></div><button id="go" class="pubButton">Generate Markdown article</button></main><script>const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);$('image').oninput=()=>{$('preview').src=$('image').value||'assets/green.svg'};$('preview').onload=()=>{$('status').textContent='Image ready.'};$('preview').onerror=()=>{$('status').textContent='Could not load image.'};$('go').onclick=()=>{const t=$('title').value.trim();if(!t)return alert('Add a headline');const slug=t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const q=v=>String(v||'').replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,' ');const md=`---\ntitle: "${q(t)}"\ncategory: "${q($('category').value)}"\ndate: "${$('date').value}"\nauthor: "${q($('author').value)}"\nread_time: "${q($('read_time').value)}"\nsource: "${q($('source').value)}"\nexcerpt: "${q($('excerpt').value)}"\nimage: "${q($('image').value||'assets/green.svg')}"\nimage_alt: "${q($('alt').value)}"\nimage_caption: "${q($('caption').value)}"\nimage_credit: "${q($('credit').value)}"\nslug: "${slug}"\n---\n\n${$('body').value}\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));a.download=slug+'.md';a.click()};</script><style>.pubGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:35px 0}.pubGrid label{font:800 10px Arial;text-transform:uppercase;letter-spacing:.08em}.pubGrid input,.pubGrid select,.pubGrid textarea{display:block;width:100%;margin-top:7px;border:1px solid #b9b5ad;background:#fff;padding:12px;font:15px Arial}.pubGrid textarea{min-height:100px}.pubGrid .short{min-height:80px}.pubGrid label:last-of-type{grid-column:1/-1}.pubGrid .preview{grid-column:1/-1;border-top:1px solid #111;padding-top:14px}.preview img{width:100%;max-height:400px;object-fit:cover}.pubButton{background:#176b4d;color:white;border:0;padding:14px 20px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}@media(max-width:768px){.pubGrid{grid-template-columns:1fr}.pubGrid label:last-of-type{grid-column:auto}}</style></body></html>
