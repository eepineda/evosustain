<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Artículo publicado en Evoford News.">
<title>Artículo | Evoford News</title><link rel="stylesheet" href="../assets/style.css?v=20261112-22">
</head>
<body>
<header class="masthead"><div class="topline"><span>Londres · Reino Unido</span><span>INFORMACIÓN · OPINIÓN · ANÁLISIS</span></div><a class="brand" href="../">EVOFORD <em>NEWS</em></a><nav class="nav"><a href="../">Portada</a><a href="../#internacional">Internacional</a><a href="../#opinion">Opinión</a></nav></header>
<main id="articleView" class="wrap" style="max-width:850px;padding-top:40px;padding-bottom:70px"><p class="muted">Cargando artículo…</p></main>
<footer><a class="footer-brand" href="../">EVOFORD NEWS</a><span>Noticias · Opinión · Análisis</span><span>© <span id="year"></span> Evoford</span></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://poywsdigujbarvnzbfnz.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1t7gv1Y9-6HHwMqW5E343A_51GH_L7f";
const root=document.getElementById("articleView");
document.getElementById("year").textContent=new Date().getFullYear();
function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function loadArticle(){
 const slug=new URLSearchParams(location.search).get("slug");
 if(!slug){root.innerHTML="<h1>Artículo no disponible</h1><p>Falta identificar la publicación.</p><a class='read-link' href='../'>Volver a portada →</a>";return;}
 const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
 const {data:a,error}=await client.from("articles").select("id,title,slug,category,author,summary,content,image_url,country,region,language,summary_en,content_en,source_title,source_url,updated_at").eq("slug",slug).eq("status","published").maybeSingle();
 if(error||!a){root.innerHTML="<h1>Artículo no disponible</h1><p>La publicación no existe o no está disponible.</p><a class='read-link' href='../'>Volver a portada →</a>";return;}
 const english=a.language==="en";
 const title=english&&a.title? a.title:a.title;
 const summary=english&&a.summary_en?a.summary_en:a.summary;
 let body=english&&a.content_en?a.content_en:a.content;
 let sourceUrl=a.source_url||"";
 let sourceTitle=a.source_title||"";
 body=String(body||"").replace(/\\n/g,"\n");
 body=body.replace(/^\s*\[?BORRADOR EDITORIAL:[^\]]*\]?\s*$/gmi,"");
 body=body.replace(/^\s*Fuente (?:original|consultada):\s*\[?([^\]\n]+)\]?\s*(?:\((https?:\/\/[^)]+)\))?\s*$/gmi,(_m,label,url)=>{const found=url||(/^https?:\/\//i.test(label)?label:"");if(found&&!sourceUrl)sourceUrl=found;if(!sourceTitle&&label&&!/^https?:\/\//i.test(label))sourceTitle=label;return "";});
 body=body.replace(/^\s*Redacta aquí una versión propia y verificada\. No copies literalmente el artículo de origen\.\s*$/gmi,"");
 if(sourceUrl){try{const parsed=new URL(sourceUrl);if(!sourceTitle){const host=parsed.hostname.replace(/^www\./,"");sourceTitle=host==="elpais.com"?"El País":host.replace(/\.com$|\.co\.uk$|\.org$/i,"").replace(/^./,ch=>ch.toUpperCase());}for(const key of [...parsed.searchParams.keys()])if(key.startsWith("utm_"))parsed.searchParams.delete(key);sourceUrl=parsed.toString();}catch(_e){sourceUrl="";}}
 if(sourceUrl){try{const parsed=new URL(sourceUrl);if(!sourceTitle){const host=parsed.hostname.replace(/^www\./,"");sourceTitle=host==="elpais.com"?"El País":host.replace(/\.com$|\.co\.uk$|\.org$/i,"").replace(/^./,ch=>ch.toUpperCase());}for(const key of [...parsed.searchParams.keys()])if(key.startsWith("utm_"))parsed.searchParams.delete(key);sourceUrl=parsed.toString();}catch(_e){sourceUrl="";}}
 const paragraphs=String(body||"").split(/\n\s*\n|\r?\n/).filter(Boolean).map(p=>"<p style='font:18px/1.85 Georgia,serif;white-space:pre-wrap'>"+esc(p)+"</p>").join("");
 const sourceCredit=sourceUrl&&/^https:\/\//i.test(sourceUrl)?"<p class='source-credit'>Fuente original: <a href='"+esc(sourceUrl)+"' target='_blank' rel='noopener noreferrer'>"+esc(sourceTitle||"Consultar medio original")+" ↗</a></p>":"";
 root.innerHTML="<div class='article-actions'><button class='print-article-btn' id='printArticleBtn' type='button'>Imprimir artículo <span aria-hidden='true'>↗</span></button></div><div class='kicker'>"+esc(a.category||"INTERNACIONAL")+"</div><h1 style='font:800 clamp(38px,6vw,64px)/1.05 Playfair Display,Georgia,serif;letter-spacing:-.04em'>"+esc(title)+"</h1><p class='dek'>"+esc(summary||"")+"</p><div class='lead-meta'>POR "+esc(a.author||"EVOFORD NEWS")+( [a.country,a.region].filter(Boolean).length ? " · "+esc([a.country,a.region].filter(Boolean).join(" · ")) : "" )+"</div>"+(a.image_url&&/^https:\/\//i.test(a.image_url)?"<img src='"+esc(a.image_url)+"' alt='' style='width:100%;height:auto;margin:28px 0'>":"")+"<hr style='border:0;border-top:1px solid #d9dee5;margin:28px 0'>"+paragraphs+sourceCredit+"<section class='share-panel' aria-label='Compartir artículo'><div class='share-heading'>COMPARTIR ESTE ARTÍCULO</div><div class='share-buttons'><a class='share-button whatsapp' id='shareWhatsapp' target='_blank' rel='noopener noreferrer' aria-label='Compartir por WhatsApp' title='WhatsApp'>wa</a><a class='share-button facebook' id='shareFacebook' target='_blank' rel='noopener noreferrer' aria-label='Compartir en Facebook' title='Facebook'>f</a><a class='share-button x-social' id='shareX' target='_blank' rel='noopener noreferrer' aria-label='Compartir en X' title='X'>𝕏</a><a class='share-button telegram' id='shareTelegram' target='_blank' rel='noopener noreferrer' aria-label='Compartir por Telegram' title='Telegram'>➤</a><button class='share-button copy-share' id='copyArticleLink' type='button' aria-label='Copiar enlace' title='Copiar enlace'>↗</button></div><p class='share-feedback' id='shareFeedback' aria-live='polite'></p></section><section class='comments-panel' id='commentsPanel'><div class='comments-title'><div class='kicker'>PARTICIPACIÓN</div><h2>Comentarios</h2><p>Publica tu opinión con respeto. Los comentarios se revisan antes de aparecer.</p></div><form id='commentForm' class='comment-form'><label for='commentName'>Nombre</label><input id='commentName' name='name' maxlength='60' required minlength='2' placeholder='Tu nombre'><label for='commentBody'>Comentario</label><textarea id='commentBody' name='comment' maxlength='2000' required minlength='3' rows='4' placeholder='Escribe tu comentario…'></textarea><button type='submit' class='comment-submit'>Enviar comentario</button><p id='commentFeedback' class='comment-feedback' aria-live='polite'></p></form><div id='approvedComments' class='approved-comments'><p class='muted'>Cargando comentarios…</p></div></section><p><a class='read-link' href='../'>← Volver a Evoford News</a></p>";
 document.title=a.title+" | Evoford News";
 // Enlaces sociales y copia del enlace permanente
 const pageUrl=location.href;
 const shareText=title+" | Evoford News";
 const setShare=(id,url)=>{const el=document.getElementById(id);if(el)el.href=url;};
 setShare("shareWhatsapp","https://wa.me/?text="+encodeURIComponent(shareText+" "+pageUrl));
 setShare("shareFacebook","https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(pageUrl));
 setShare("shareX","https://twitter.com/intent/tweet?text="+encodeURIComponent(shareText)+"&url="+encodeURIComponent(pageUrl));
 setShare("shareTelegram","https://t.me/share/url?url="+encodeURIComponent(pageUrl)+"&text="+encodeURIComponent(shareText));
 const copyBtn=document.getElementById("copyArticleLink");
 if(copyBtn)copyBtn.addEventListener("click",async()=>{const feedback=document.getElementById("shareFeedback");try{await navigator.clipboard.writeText(pageUrl);feedback.textContent="Enlace copiado."; }catch(_e){feedback.textContent="No se pudo copiar automáticamente. Copia la dirección del navegador."; }});
 // Comentarios: se muestran solo los aprobados; los nuevos quedan pendientes de moderación.
 const commentsBox=document.getElementById("approvedComments");
 const {data:comments,error:commentsError}=await client.from("article_comments").select("author_name,body,created_at").eq("article_id",a.id).eq("status","approved").order("created_at",{ascending:false}).limit(50);
 if(commentsBox){commentsBox.innerHTML=commentsError?"<p class='muted'>No se pudieron cargar los comentarios.</p>":(comments?.length?comments.map(c=>"<article class='comment-item'><b>"+esc(c.author_name)+"</b><p>"+esc(c.body).replace(/\\n/g,"<br>")+"</p><time>"+new Date(c.created_at).toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"})+"</time></article>").join(""):"<p class='muted'>Todavía no hay comentarios. Puedes iniciar la conversación.</p>");}
 const commentForm=document.getElementById("commentForm");
 if(commentForm)commentForm.addEventListener("submit",async event=>{event.preventDefault();const feedback=document.getElementById("commentFeedback");const submit=commentForm.querySelector("button[type='submit']");const authorName=document.getElementById("commentName").value.trim();const commentBody=document.getElementById("commentBody").value.trim();if(authorName.length<2||commentBody.length<3)return;submit.disabled=true;feedback.textContent="Enviando…";const {error:sendError}=await client.from("article_comments").insert({article_id:a.id,author_name:authorName,body:commentBody,status:"pending"});submit.disabled=false;if(sendError){feedback.textContent="No se pudo enviar. Inténtalo de nuevo más tarde.";console.error(sendError.message);}else{commentForm.reset();feedback.textContent="Comentario recibido. Aparecerá cuando sea revisado."; }});
 const printButton=document.getElementById("printArticleBtn");
 if(printButton) printButton.addEventListener("click",()=>window.print());
}
loadArticle();
</script>
</body></html>
