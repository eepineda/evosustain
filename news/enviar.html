<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Envía tu noticia | Evoford News"><link rel="stylesheet" href="assets/style.css"><style>
.send{max-width:760px;margin:42px auto;padding:0 20px}.send article{background:#fff;border:1px solid #d9dee7;padding:clamp(20px,4vw,38px)}.send h1{font:700 clamp(30px,5vw,44px) Georgia,serif}.send p{line-height:1.6;color:#596574}.send form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.send label{font-size:13px;font-weight:700}.send input,.send select,.send textarea{width:100%;padding:12px;border:1px solid #cbd2dc;font:inherit}.send textarea{min-height:210px}.full{grid-column:1/-1}.send button{justify-self:start;background:#102b4e;color:white;border:0;padding:13px 22px;font-weight:700}.msg{grid-column:1/-1;min-height:24px}.trap{position:absolute;left:-9999px}@media(max-width:600px){.send form{grid-template-columns:1fr}.full,.msg{grid-column:auto}}
</style></head><body><div class="ecosystem-nav"><div class="ecosystem-nav-inner"><a class="ecosystem-mark" href="../index.html">EVOFORD <span>ECOSYSTEM</span></a><nav><a href="./">Evoford News</a><a href="admin/">Acceso editorial</a></nav></div></div><main class="send"><article><span class="kicker">PARTICIPA EN EVOFORD NEWS</span><h1>Envía tu noticia</h1><p>Comparte una noticia, nota de prensa o artículo de opinión. Todo envío será revisado por la redacción. Enviar una propuesta no garantiza su publicación.</p>
<form id="submissionForm"><div><label for="name">Nombre y apellidos</label><input id="name" maxlength="120" required></div><div><label for="email">Correo electrónico</label><input id="email" type="email" maxlength="254" required></div><div><label for="kind">Tipo de contenido</label><select id="kind"><option value="noticia">Noticia</option><option value="nota_prensa">Nota de prensa</option><option value="opinion">Artículo de opinión</option><option value="otro">Otro</option></select></div><div><label for="title">Título</label><input id="title" maxlength="180" required></div><div class="full"><label for="body">Texto</label><textarea id="body" minlength="50" maxlength="30000" required></textarea><small>Entre 50 y 30.000 caracteres.</small></div><div class="full"><label for="files">Adjuntos (opcional)</label><input id="files" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.pdf,.doc,.docx"><small>Máximo 3 archivos de hasta 8 MB cada uno.</small></div><div class="trap"><label for="website">No rellenar</label><input id="website" tabindex="-1"></div><button type="submit">Enviar a la redacción</button><p class="msg" id="msg" role="status"></p></form></article></main><footer><a class="footer-brand" href="./">EVOFORD NEWS</a></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/submit.js"></script></body></html>
